<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy & Bouquet Surprise for VIA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050508;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255, 220, 235, 0.8);
            font-size: 14px;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
            pointer-events: none;
            text-align: center;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hint">[ KLIK DI MANA SAJA UNTUK KEJUTAN ]</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let width, height;
        let state = 'RIBBON'; // 'RIBBON' -> 'BEAR_AND_BOUQUET'
        let particles = [];
        let stars = [];
        let flowers = [];
        let ribbonTargets = [];
        let combinedTargets = [];
        let time = 0;

        const ASCII_CHARS = ['@', '#', '%', '*', '+', '=', ':', '-', '.'];
      const MESSAGE = "HAPPY BIRTHDAY VIA";

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
            initFlowers();
            generateShapes();
            assignTargets();
        }

        // Bintang latar belakang kecil
        function initStars() {
            stars = [];
            const count = Math.floor((width * height) / 6000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        // Kelopak Bunga Melayang di Pinggir Latar Belakang
        class Flower {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                const side = Math.random();
                if (side < 0.5) {
                    this.x = Math.random() * (width * 0.28);
                } else {
                    this.x = width * 0.72 + Math.random() * (width * 0.28);
                }

                this.y = initial ? Math.random() * height : -30;
                this.size = Math.random() * 5 + 4;
                this.speedY = Math.random() * 0.9 + 0.4;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
                
                const colors = ['#ff70a6', '#ff9770', '#b8b8ff', '#ffd670', '#ffffff', '#e7c6ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.25;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(time * 0.02 + this.y * 0.01) * 0.4 + this.speedX;
                this.angle += this.spin;
                if (this.y > height + 30) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.alpha;

                ctx.fillStyle = this.color;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.rotate((Math.PI * 2) / 5);
                    ctx.ellipse(0, -this.size * 0.6, this.size * 0.4, this.size * 0.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#fff9cc';
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function initFlowers() {
            flowers = [];
            for (let i = 0; i < 40; i++) {
                flowers.push(new Flower());
            }
        }

        // Render bentuk ke canvas tersembunyi untuk diubah menjadi koordinat ASCII
        function sampleShape(drawFn, stepX, stepY) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width;
            offCanvas.height = height;
            const oCtx = offCanvas.getContext('2d');

            drawFn(oCtx);

            const imgData = oCtx.getImageData(0, 0, width, height).data;
            const points = [];

            for (let y = 0; y < height; y += stepY) {
                for (let x = 0; x < width; x += stepX) {
                    const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
                    const r = imgData[idx];
                    const g = imgData[idx + 1];
                    const b = imgData[idx + 2];
                    const a = imgData[idx + 3];

                    if (a > 128) {
                        const brightness = (r + g + b) / (3 * 255);
                        const charIdx = Math.min(
                            ASCII_CHARS.length - 1,
                            Math.floor((1 - brightness) * (ASCII_CHARS.length - 1))
                        );
                        points.push({
                            x: x,
                            y: y,
                            color: `rgb(${r},${g},${b})`,
                            char: ASCII_CHARS[charIdx],
                            isText: (r > 240 && g > 240 && b > 240)
                        });
                    }
                }
            }
            return points;
        }

        // Gambar 1: Bentuk Pita / Hati (Tampilan Awal)
        function drawRibbonShape(oCtx) {
            const cx = width / 2;
            const cy = height / 2;
            const scale = Math.min(width, height) * 0.0032;
            oCtx.save();
            oCtx.translate(cx, cy);
            oCtx.scale(scale, scale);

            const gradTop = oCtx.createLinearGradient(-80, -90, 80, 0);
            gradTop.addColorStop(0, '#f4a2b8');
            gradTop.addColorStop(0.5, '#d8e2dc');
            gradTop.addColorStop(1, '#bde0fe');

            oCtx.fillStyle = gradTop;
            oCtx.beginPath();
            oCtx.ellipse(-42, -55, 38, 22, -0.45, 0, Math.PI * 2);
            oCtx.fill();
            oCtx.beginPath();
            oCtx.ellipse(42, -55, 38, 22, 0.45, 0, Math.PI * 2);
            oCtx.fill();

            const gradBody = oCtx.createLinearGradient(0, -35, 0, 95);
            gradBody.addColorStop(0, '#cdb4db');
            gradBody.addColorStop(0.35, '#ffafcc');
            gradBody.addColorStop(0.7, '#bde0fe');
            gradBody.addColorStop(1, '#f4978e');

            oCtx.fillStyle = gradBody;
            oCtx.beginPath();
            oCtx.moveTo(0, -25);
            oCtx.bezierCurveTo(-55, -55, -105, 5, 0, 95);
            oCtx.bezierCurveTo(105, 5, 55, -55, 0, -25);
            oCtx.fill();

            oCtx.strokeStyle = '#3a2e39';
            oCtx.lineWidth = 4;
            oCtx.beginPath();
            oCtx.moveTo(-60, -15);
            oCtx.quadraticCurveTo(0, -5, 60, -15);
            oCtx.stroke();

            oCtx.restore();
        }

        // Gambar 2: Beruang di Tengah & Buket Bunga Cantik di Samping Luar
        function drawCombinedShape(oCtx) {
            const cx = width / 2;
            const cy = height / 2 + 10;
            const scale = Math.min(width, height) * 0.0026;

            // --- 1. GAMBAR BONEKA BERUANG DI TENGAH ---
            oCtx.save();
            oCtx.translate(cx, cy);
            oCtx.scale(scale, scale);

            // Telinga
            oCtx.fillStyle = '#8d6e63';
            oCtx.beginPath(); oCtx.arc(-55, -105, 26, 0, Math.PI * 2); oCtx.fill();
            oCtx.beginPath(); oCtx.arc(55, -105, 26, 0, Math.PI * 2); oCtx.fill();
            oCtx.fillStyle = '#d7ccc8';
            oCtx.beginPath(); oCtx.arc(-55, -105, 13, 0, Math.PI * 2); oCtx.fill();
            oCtx.beginPath(); oCtx.arc(55, -105, 13, 0, Math.PI * 2); oCtx.fill();

            // Kepala
            const headGrad = oCtx.createRadialGradient(-15, -75, 10, 0, -65, 75);
            headGrad.addColorStop(0, '#bcaaa4');
            headGrad.addColorStop(1, '#6d4c41');
            oCtx.fillStyle = headGrad;
            oCtx.beginPath(); oCtx.ellipse(0, -65, 72, 60, 0, 0, Math.PI * 2); oCtx.fill();

            // Moncong & Muka
            oCtx.fillStyle = '#efebe9';
            oCtx.beginPath(); oCtx.ellipse(0, -50, 26, 20, 0, 0, Math.PI * 2); oCtx.fill();
            oCtx.fillStyle = '#1a1a1a';
            oCtx.beginPath(); oCtx.arc(-25, -72, 6, 0, Math.PI * 2); oCtx.fill();
            oCtx.beginPath(); oCtx.arc(25, -72, 6, 0, Math.PI * 2); oCtx.fill();
            oCtx.beginPath(); oCtx.ellipse(0, -56, 9, 6, 0, 0, Math.PI * 2); oCtx.fill();

            // Badan Beruang
            const bodyGrad = oCtx.createRadialGradient(0, 30, 15, 0, 35, 105);
            bodyGrad.addColorStop(0, '#a1887f');
            bodyGrad.addColorStop(1, '#5d4037');
            oCtx.fillStyle = bodyGrad;
            oCtx.beginPath(); oCtx.ellipse(0, 35, 88, 82, 0, 0, Math.PI * 2); oCtx.fill();

            // Kaki
            oCtx.fillStyle = '#795548';
            oCtx.beginPath(); oCtx.ellipse(-55, 105, 34, 24, -0.2, 0, Math.PI * 2); oCtx.fill();
            oCtx.beginPath(); oCtx.ellipse(55, 105, 34, 24, 0.2, 0, Math.PI * 2); oCtx.fill();

            // Papan Ucapan di Dada
            oCtx.fillStyle = '#d64550';
            oCtx.beginPath(); oCtx.roundRect(-115, -5, 230, 68, 18); oCtx.fill();

            // Tangan Beruang
            oCtx.fillStyle = '#8d6e63';
            oCtx.beginPath(); oCtx.ellipse(-112, 28, 22, 16, 0.3, 0, Math.PI * 2); oCtx.fill();
            oCtx.beginPath(); oCtx.ellipse(112, 28, 22, 16, -0.3, 0, Math.PI * 2); oCtx.fill();

            // Teks Ucapan Bersih
            oCtx.fillStyle = '#ffffff';
            oCtx.font = 'bold 21px Arial, sans-serif';
            oCtx.textAlign = 'center';
            oCtx.textBaseline = 'middle';
            oCtx.fillText('HAPPY BIRTHDAY', 0, 17);
            oCtx.font = 'bold 25px Arial, sans-serif';
            oCtx.fillText('VIA', 0, 44);
            oCtx.restore();


            // --- 2. BUKET BUNGA SAMPING YANG LEBIH CANTIK & DETAIL ---
            function drawDetailedBouquet(bx, by) {
                oCtx.save();
                oCtx.translate(bx, by);
                oCtx.scale(scale * 0.9, scale * 0.9);

                // Daun latar belakang buket (hijau rimbun)
                oCtx.fillStyle = '#2d6a4f';
                oCtx.beginPath(); oCtx.ellipse(-22, -45, 8, 28, -0.4, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.ellipse(22, -45, 8, 28, 0.4, 0, Math.PI * 2); oCtx.fill();

                // Kertas pembungkus buket cokelat estetik
                oCtx.fillStyle = '#d4a373';
                oCtx.beginPath();
                oCtx.moveTo(0, 60);
                oCtx.lineTo(-52, -18);
                oCtx.lineTo(52, -18);
                oCtx.closePath();
                oCtx.fill();

                // Garis lipatan kertas pembungkus agar bertekstur
                oCtx.strokeStyle = '#bc6c25';
                oCtx.lineWidth = 2.5;
                oCtx.beginPath();
                oCtx.moveTo(0, 60); oCtx.lineTo(0, -18);
                oCtx.stroke();

                // Batang bunga hijau
                oCtx.fillStyle = '#52b788';
                oCtx.fillRect(-4, -50, 8, 75);

                // --- KUMPULAN BUNGA DI DALAM BUKET ---
                // 1. Tulip Pink Utama (Tengah-Kiri)
                oCtx.fillStyle = '#ff5c8a';
                oCtx.beginPath(); oCtx.ellipse(-16, -55, 16, 22, -0.15, 0, Math.PI * 2); oCtx.fill();
                oCtx.fillStyle = '#ff8fab'; // Aksen kelopak dalam tulip
                oCtx.beginPath(); oCtx.ellipse(-16, -53, 9, 14, -0.15, 0, Math.PI * 2); oCtx.fill();

                // 2. Bunga Lavender / Ungu (Kanan)
                oCtx.fillStyle = '#9b5de5';
                oCtx.beginPath(); oCtx.arc(18, -58, 9, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.arc(23, -72, 7, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.arc(14, -68, 7, 0, Math.PI * 2); oCtx.fill();
                oCtx.fillStyle = '#c77dff'; // Pucuk lavender
                oCtx.beginPath(); oCtx.arc(23, -72, 3, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.arc(14, -68, 3, 0, Math.PI * 2); oCtx.fill();

                // 3. Bunga Aster Putih dengan Putik Kuning Manis (Tengah)
                oCtx.fillStyle = '#ffffff';
                oCtx.beginPath(); oCtx.arc(2, -40, 13, 0, Math.PI * 2); oCtx.fill();
                oCtx.fillStyle = '#ffb703';
                oCtx.beginPath(); oCtx.arc(2, -40, 5, 0, Math.PI * 2); oCtx.fill();

                // Kartu kecil di tengah buket (seperti di referensi gambar)
                oCtx.fillStyle = '#fff3b0';
                oCtx.fillRect(-8, -5, 16, 14);
                oCtx.fillStyle = '#d64550'; // Mini love di kartu
                oCtx.beginPath(); oCtx.arc(-3, 2, 2.5, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.arc(3, 2, 2.5, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.lineTo(0, 7); oCtx.lineTo(-6, 1); oCtx.lineTo(6, 1); oCtx.fill();

                // --- PITA MERAH MUDA YANG CANTIK DI BAWAH ---
                oCtx.fillStyle = '#ff70a6';
                // Sayap pita kiri & kanan
                oCtx.beginPath(); oCtx.ellipse(-20, 24, 13, 7, 0.4, 0, Math.PI * 2); oCtx.fill();
                oCtx.beginPath(); oCtx.ellipse(20, 24, 13, 7, -0.4, 0, Math.PI * 2); oCtx.fill();
                // Simpul tengah pita
                oCtx.beginPath(); oCtx.arc(0, 24, 7, 0, Math.PI * 2); oCtx.fill();
                // Ekor pita menjuntai
                oCtx.beginPath(); oCtx.moveTo(-4, 27); oCtx.lineTo(-12, 44); oCtx.lineTo(-7, 46); oCtx.fill();
                oCtx.beginPath(); oCtx.moveTo(4, 27); oCtx.lineTo(12, 44); oCtx.lineTo(7, 46); oCtx.fill();

                oCtx.restore();
            }

            // Buket diposisikan di sisi paling luar kiri dan kanan (jarak 310 pixel) agar sejajar rapi
            drawDetailedBouquet(cx - 310, cy + 10);
            drawDetailedBouquet(cx + 310, cy + 10);
        }

        function generateShapes() {
            const stepX = width < 600 ? 6 : 7;
            const stepY = width < 600 ? 8 : 9;
            ribbonTargets = sampleShape(drawRibbonShape, stepX, stepY);
            combinedTargets = sampleShape(drawCombinedShape, stepX, stepY);
        }

        class Particle {
            constructor(target) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.tx = target.x;
                this.ty = target.y;
                this.vx = 0;
                this.vy = 0;
                this.color = target.color;
                this.char = target.char;
                this.isText = target.isText;
                this.size = width < 600 ? 8 : 10;
            }
            setTarget(target) {
                this.tx = target.x;
                this.ty = target.y;
                this.color = target.color;
                this.char = target.char;
                this.isText = target.isText;
            }
            explode() {
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 18 + 6;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
            }
            update() {
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                this.vx += dx * 0.065;
                this.vy += dy * 0.065;
                this.vx *= 0.80;
                this.vy *= 0.80;
                this.x += this.vx;
                this.y += this.vy;

                this.renderX = this.x + Math.sin(time * 0.05 + this.ty * 0.1) * 0.8;
                this.renderY = this.y + Math.cos(time * 0.05 + this.tx * 0.1) * 0.8;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.font = `${this.isText ? 'bold ' : ''}${this.size}px Courier New`;
                ctx.fillText(this.char, this.renderX, this.renderY);
            }
        }

        function assignTargets() {
            const activeList = state === 'RIBBON' ? ribbonTargets : combinedTargets;
            const maxCount = Math.max(ribbonTargets.length, combinedTargets.length);

            if (particles.length === 0) {
                for (let i = 0; i < maxCount; i++) {
                    const target = activeList[i % activeList.length];
                    particles.push(new Particle(target));
                }
            } else {
                for (let i = 0; i < particles.length; i++) {
                    const target = activeList[i % activeList.length];
                    particles[i].setTarget(target);
                    particles[i].explode();
                }
            }
        }

        window.addEventListener('click', () => {
            if (state === 'RIBBON') {
                state = 'BEAR_AND_BOUQUET';
                hint.style.display = 'none';
                assignTargets();
            } else {
                particles.forEach(p => p.explode());
            }
        });

        function animate() {
            time++;
            ctx.fillStyle = 'rgba(5, 5, 8, 0.35)';
            ctx.fillRect(0, 0, width, height);

            // 1. Bintang Latar Belakang
            stars.forEach(s => {
                s.alpha += s.speed;
                const opacity = Math.abs(Math.sin(s.alpha));
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // 2. Kelopak Bunga Melayang di Pinggir
            flowers.forEach(f => {
                f.update();
                f.draw();
            });

            // 3. Partikel ASCII Utama
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
